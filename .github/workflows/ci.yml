name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The shipping Go is '1.27' below and GO_VERSION=1.27 in the Dockerfile: the
# image, the release binaries and govulncheck all use it. Move them together.
# The test job also runs go.mod's minimum, the oldest Go that must build.
# Every action is pinned to a full commit SHA, its version in the comment.

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, '1.27']
    name: go (${{ matrix.go }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go (go.mod minimum)
        if: matrix.go == 'go.mod'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Go (shipping)
        if: matrix.go != 'go.mod'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 ./...

      # Three more release targets, so a break shows here and not at the
      # next release. linux/amd64 is the build above; darwin/amd64 builds
      # the same code as darwin/arm64.
      - name: Cross-build
        if: matrix.go != 'go.mod'
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/forgemap
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/forgemap
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/forgemap

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The shipping Go: its standard library is what the image runs.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  image:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The image builds with the Dockerfile's GO_VERSION (1.27); this step
      # only pins the toolchain on the runner to the same Go.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build image
        run: docker build --build-arg VERSION=ci -t forgemap:ci .

      - name: Demo smoke
        run: bash scripts/demo-smoke.sh forgemap:ci

      # Both release platforms, as the release builds them, without a push:
      # QEMU runs the final stage's two RUN steps for arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=ci .
