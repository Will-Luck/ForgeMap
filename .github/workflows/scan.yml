name: Weekly scan

# Scans two things with govulncheck once a week, so a Go security release
# between ForgeMap releases is noticed. The govulncheck job scans the latest
# release's linux/amd64 binary (what the binary downloads ship). The image job
# scans the forgemap binary inside ghcr.io/will-luck/forgemap:latest (what the
# image installs run, built with the Go that image was released with). Binary mode
# reports the vulnerable symbols a binary holds, not whether ForgeMap reaches
# them: any finding fails this run. A standard library finding means
# "rebuild needed" (a release built with the newest Go); a module finding
# means a dependency bump. GitHub turns a schedule off after 60 days with no
# push to the repo: turn it back on in the Actions tab.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --pattern forgemap-linux-amd64 --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          echo "Scanning $(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"

      - name: govulncheck (binary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode=binary forgemap-linux-amd64

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      # The binary is copied out of a created container: the image never runs.
      - name: Copy the binary out of the latest image
        run: |
          set -euo pipefail
          docker pull ghcr.io/will-luck/forgemap:latest
          id=$(docker create ghcr.io/will-luck/forgemap:latest)
          docker cp "$id:/usr/local/bin/forgemap" forgemap-image
          docker rm "$id"

      - name: govulncheck (image binary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -mode=binary forgemap-image
