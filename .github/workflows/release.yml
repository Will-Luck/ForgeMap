name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# The shipping Go is '1.27' below and GO_VERSION=1.27 in the Dockerfile: the
# image and the binaries are built with the same Go. Move them together.
# Every action is pinned to a full commit SHA, its version in the comment;
# .github/dependabot.yml proposes the bumps.
# A tag publishes nothing unless the tests, the demo smoke and govulncheck
# pass on the tagged commit. No cache from another run is restored (no Go
# cache, no image build cache, no cached emulator image), and the binaries and the ghcr.io image are
# signed with build provenance (gh attestation verify), so a download can be
# checked against this workflow.

jobs:
  # The checks CI runs, on the tagged commit: a tag on a commit whose tests,
  # demo smoke or vulnerability check fail publishes nothing.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Build image
        run: docker build --build-arg VERSION=ci -t forgemap:ci .

      - name: Demo smoke
        run: bash scripts/demo-smoke.sh forgemap:ci

      # The same tool and version as CI's security job.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The Go build cross-compiles natively (FROM --platform=$BUILDPLATFORM);
      # QEMU is only for the final stage's two RUN steps (apk add, adduser),
      # which run in the target platform's Alpine. cache-image: false pulls
      # the emulator image each time: the action's default restores it from
      # the Actions cache, which a run on the default branch can write.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKERHUB_PUSH_TOKEN is a Read & Write token, for the image push only.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # Named here, not from github.repository: a tag pushed before the
          # GitHub repo's rename still publishes under the README's names.
          images: |
            ghcr.io/will-luck/forgemap
            docker.io/willluck/forgemap
          # latest moves for a release only: a tag with a "-" (v0.3.0-rc.1)
          # is a prerelease. No automatic latest besides this one.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      # Signed build provenance for the image on ghcr.io, stored beside it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/will-luck/forgemap
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # The README sync is the one third-party action given a Docker Hub token
  # (DOCKERHUB_TOKEN, which nothing else takes; the push has its own), so it
  # runs alone: no registry login, no package or release write access, and a
  # checkout that keeps no token in .git/config.
  dockerhub-readme:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: willluck/forgemap
          short-description: A live status page for every project on your Gitea, Forgejo and GitHub accounts
          readme-filepath: ./README.md
          enable-url-completion: true

  binaries:
    runs-on: ubuntu-latest
    needs: [test, publish]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The shipping Go, as the image is built with (go.mod's go line is only
      # the oldest Go that builds ForgeMap).
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      - name: Build binaries
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 linux/arm/v7 darwin/amd64 darwin/arm64; do
            os="${pair%%/*}"
            arch="${pair#*/}"
            goarch="${arch%%/*}"
            goarm=""
            if [ "$arch" = arm/v7 ]; then
              goarm=7
            fi
            GOOS="$os" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/forgemap-${os}-${arch//\//-}" ./cmd/forgemap
          done
          (cd dist && sha256sum forgemap-* > SHA256SUMS)
          ls -la dist/

      - name: Release notes from the tag annotation
        run: |
          set -euo pipefail
          # actions/checkout leaves the tag as a lightweight ref to the commit,
          # without its annotation (the notes): fetch the tag object itself.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body=$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")
          if [ -z "$body" ]; then
            body=$(git log -1 --pretty=%B "${GITHUB_REF_NAME}")
          fi
          printf '%s' "$body" > release-notes.md
          echo "Wrote $(wc -c < release-notes.md) bytes to release-notes.md"

      # Signed build provenance for every file in dist/, before the release
      # is published.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # A tag with a "-" is a prerelease, and never the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*
