name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# The shipping Go is '1.27' below and GO_VERSION=1.27 in the Dockerfile: the
# image and the binaries are built with the same Go. Move them together.
# Every action is pinned to a full commit SHA, its version in the comment;
# .github/dependabot.yml proposes the bumps.

jobs:
  # The checks CI runs, on the tagged commit: a tag on a commit whose tests
  # or demo smoke fail publishes nothing.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Build image
        run: docker build --build-arg VERSION=ci -t forgemap:ci .

      - name: Demo smoke
        run: bash scripts/demo-smoke.sh forgemap:ci

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The Go build cross-compiles natively (FROM --platform=$BUILDPLATFORM);
      # QEMU is only for the final stage's two RUN steps (apk add, adduser),
      # which run in the target platform's Alpine.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKERHUB_PUSH_TOKEN is a Read & Write token, for the image push only.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # Named here, not from github.repository: a tag pushed before the
          # GitHub repo's rename still publishes under the README's names.
          images: |
            ghcr.io/will-luck/forgemap
            docker.io/willluck/forgemap
          # latest moves for a release only: a tag with a "-" (v0.3.0-rc.1)
          # is a prerelease. No automatic latest besides this one.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  # The README sync is the one third-party action given a Docker Hub token
  # (DOCKERHUB_TOKEN, which nothing else takes; the push has its own), so it
  # runs alone: no registry login, no package or release write access, and a
  # checkout that keeps no token in .git/config.
  dockerhub-readme:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: willluck/forgemap
          short-description: A live status page for every project on your Gitea, Forgejo and GitHub accounts
          readme-filepath: ./README.md
          enable-url-completion: true

  binaries:
    runs-on: ubuntu-latest
    needs: [test, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The shipping Go, as the image is built with (go.mod's go line is only
      # the oldest Go that builds ForgeMap).
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 linux/arm/v7 darwin/amd64 darwin/arm64; do
            os="${pair%%/*}"
            arch="${pair#*/}"
            goarch="${arch%%/*}"
            goarm=""
            if [ "$arch" = arm/v7 ]; then
              goarm=7
            fi
            GOOS="$os" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/forgemap-${os}-${arch//\//-}" ./cmd/forgemap
          done
          (cd dist && sha256sum forgemap-* > SHA256SUMS)
          ls -la dist/

      - name: Release notes from the tag annotation
        run: |
          set -euo pipefail
          # actions/checkout leaves the tag as a lightweight ref to the commit,
          # without its annotation (the notes): fetch the tag object itself.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          body=$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")
          if [ -z "$body" ]; then
            body=$(git log -1 --pretty=%B "${GITHUB_REF_NAME}")
          fi
          printf '%s' "$body" > release-notes.md
          echo "Wrote $(wc -c < release-notes.md) bytes to release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # A tag with a "-" is a prerelease, and never the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*
